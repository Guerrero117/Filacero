<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaCero - PWA</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
</head>
<body>

    <header class="app-header">
        <h1>FilaCero PWA</h1>
        <p class="author">Alumno: Miguel Octavio Guerrero Salazar</p>
    </header>

    <div id="network-status" class="network-status hidden"></div>

    <main class="container">
        <!-- Formulario para solicitar turno -->
        <section class="card">
            <h2>Solicitar Turno Médico</h2>
            <form id="turno-form">
                <div class="form-group">
                    <label for="nombrePaciente">Nombre del Paciente:</label>
                    <input type="text" id="nombrePaciente" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="motivoConsulta">Motivo de Consulta / Síntomas:</label>
                    <input type="text" id="motivoConsulta" required placeholder="Ej. Dolor de cabeza y fiebre">
                </div>
                <div class="form-group">
                    <label for="nivelTriage">Nivel de Triage:</label>
                    <select id="nivelTriage">
                        <option value="Urgente">Urgente (Rojo)</option>
                        <option value="Moderado" selected>Moderado (Amarillo)</option>
                        <option value="Rutina">Rutina (Verde)</option>
                    </select>
                </div>
                <button type="submit" class="btn">Pedir Turno</button>
            </form>
        </section>

        <!-- Estimación de tiempo -->
        <section class="card" id="estimacion-card" style="background: #f8fafc; padding: 15px; margin-top: 15px; border-radius: 8px;">
            <h3>Estimación de Espera</h3>
            <p id="tiempo-espera">Calculando tiempo estimado...</p>
        </section>

        <!-- Listado en tiempo real -->
        <section class="card" style="margin-top: 20px;">
            <h2>Turnos en Tiempo Real</h2>
            <button id="btn-refresh" class="btn">Actualizar Turnos</button>
            <div id="loading" class="spinner hidden">Cargando...</div>
            <ul id="turnos-list" class="turnos-list">
                <!-- Se llenará con JS -->
            </ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
